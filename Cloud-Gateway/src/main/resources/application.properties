spring.application.name=Cloud-Gateway
logging.level.com.Gateway.Manas=debug
server.port=7009

# Connect to Config Server using Docker service name
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://config-server:9196

# Enable health endpoint for monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=cloud-gateway
eureka.instance.ip-address=cloud-gateway

# Enable service discovery for dynamic routing
spring.cloud.gateway.discovery.locator.enabled=true

# Gateway routes using service discovery (use service names)
spring.cloud.gateway.routes[0].id=UCSP
spring.cloud.gateway.routes[0].uri=lb://vehicle-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/VehicleService/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[1].id=IDENTITY-SERVICE
spring.cloud.gateway.routes[1].uri=lb://identity-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[2].id=CartService
spring.cloud.gateway.routes[2].uri=lb://cart-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/CartAPI/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[3].id=CouponService
spring.cloud.gateway.routes[3].uri=lb://coupon-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/CouponAPI/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[4].id=checkoutService
spring.cloud.gateway.routes[4].uri=lb://checkout-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/CheckoutAPI/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

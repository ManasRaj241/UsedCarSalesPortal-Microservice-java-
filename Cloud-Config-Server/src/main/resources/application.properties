spring.application.name=Cloud-Config-Server
server.port=9196

# Git URI for fetching config files
spring.cloud.config.server.git.uri=https://github.com/ManasRaj241/cloud-config-server

# Enable health endpoint for monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Eureka Configuration for Docker
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# Use container name instead of localhost
eureka.instance.hostname=config-server
eureka.instance.ip-address=config-server

# Optional: Enable IP address if needed
eureka.instance.prefer-ip-address=false

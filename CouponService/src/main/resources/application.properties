spring.application.name=CouponService
server.port=1114

# Connect to Config Server using Docker service name
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://config-server:9196

# Enable health endpoint for monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Database configuration (Connect to local MySQL using host.docker.internal)
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/coupon_service
spring.datasource.username=root
spring.datasource.password=Manas098#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=coupon-service
eureka.instance.ip-address=coupon-service

# Swagger API docs
springdoc.api-docs.path=/coupon-docs
